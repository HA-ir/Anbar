<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>انبار · مینی‌اپ تلگرام</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-color: var(--tg-theme-bg-color, #0d1117);
  --text-color: var(--tg-theme-text-color, #e6edf3);
  --hint-color: var(--tg-theme-hint-color, #8b949e);
  --button-color: var(--tg-theme-button-color, #2f6bff);
  --button-text-color: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg-color: var(--tg-theme-secondary-bg-color, #161b22);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", sans-serif; }
body { background: var(--bg-color); color: var(--text-color); padding: 16px; min-height: 100vh; }
.header { text-align: center; margin-bottom: 20px; }
.header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 13px; color: var(--hint-color); }
.card { background: var(--secondary-bg-color); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.06); }
.upload-btn { display: block; width: 100%; padding: 14px; background: var(--button-color); color: var(--button-text-color); border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
.file-list { margin-top: 16px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.file-name { font-size: 14px; font-weight: 500; }
.file-meta { font-size: 12px; color: var(--hint-color); }
</style>
</head>
<body>
<div class="header">
  <h1>📦 انبار (Telegram Mini App)</h1>
  <p>فضای ذخیره‌سازی ابری امن و فوق‌سریع</p>
</div>

<div class="card">
  <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)">
  <button class="upload-btn" onclick="document.getElementById('file-input').click()">📤 انتخاب و آپلود فایل</button>
  <div id="status" style="margin-top: 10px; font-size: 13px; text-align: center; color: var(--hint-color);"></div>
</div>

<div class="card">
  <h3 style="font-size: 15px; margin-bottom: 12px;">📁 آخرین فایل‌ها</h3>
  <div id="files" class="file-list">
    <p style="color: var(--hint-color); font-size: 13px; text-align: center;">درحال بارگذاری...</p>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

async function loadFiles() {
  try {
    const res = await fetch('/api/v1/admin/objects?limit=10', { credentials: 'omit' });
    if (!res.ok) {
      document.getElementById('files').innerHTML = '<p style="color: var(--hint-color); font-size: 13px; text-align: center;">برای مشاهده فایل‌ها لاگین کنید.</p>';
      return;
    }
    const data = await res.json();
    const list = data.objects || [];
    if (list.length === 0) {
      document.getElementById('files').innerHTML = '<p style="color: var(--hint-color); font-size: 13px; text-align: center;">هیچ فایلی یافت نشد.</p>';
      return;
    }
    document.getElementById('files').innerHTML = list.map(f => `
      <div class="file-item">
        <div>
          <div class="file-name">${f.filename}</div>
          <div class="file-meta">${(f.size / (1024*1024)).toFixed(2)} MB</div>
        </div>
        <a href="/f/${f.id}" target="_blank" style="color: var(--button-color); text-decoration: none; font-size: 13px;">دانلود</a>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('files').innerHTML = '<p style="color: var(--hint-color); font-size: 13px; text-align: center;">خطا در دریافت لیست</p>';
  }
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById('status');
  status.textContent = 'درحال آپلود: ' + file.name + '...';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/v1/upload', {
      method: 'POST',
      body: formData
    });
    if (res.ok) {
      const data = await res.json();
      status.textContent = '✅ آپلود موفق: ' + (data.id || data.object_id);
      loadFiles();
    } else {
      status.textContent = '❌ خطا در آپلود (' + res.status + ')';
    }
  } catch (err) {
    status.textContent = '❌ خطای شبکه';
  }
}

loadFiles();
</script>
</body>
</html>
