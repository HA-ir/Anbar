<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>انبار · Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-color: var(--tg-theme-bg-color, #0b0f17);
  --text-color: var(--tg-theme-text-color, #f1f5f9);
  --hint-color: var(--tg-theme-hint-color, #94a3b8);
  --link-color: var(--tg-theme-link-color, #3b82f6);
  --button-color: var(--tg-theme-button-color, #3b82f6);
  --button-text-color: var(--tg-theme-button-text-color, #ffffff);
  --secondary-bg-color: var(--tg-theme-secondary-bg-color, #131924);
  --card-bg: var(--tg-theme-section-bg-color, #161f30);
  --border-color: rgba(255, 255, 255, 0.08);
  --brand: #3b82f6;
  --ok: #10b981;
  --err: #ef4444;
  --warn: #f59e0b;
  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --btn-h: 38px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
:focus-visible { outline: 2px solid var(--button-color); outline-offset: 2px; }
body { background: var(--bg-color); color: var(--text-color); padding: 14px; min-height: 100vh; }
.header { text-align: center; margin-bottom: 16px; }
.header h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.header p { font-size: 12.5px; color: var(--hint-color); }

.card { background: var(--secondary-bg-color); border-radius: var(--radius-lg); padding: 14px; margin-bottom: 14px; border: 1px solid var(--border-color); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: var(--button-color); color: var(--button-text-color); border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; transition: opacity .15s ease; min-height: var(--btn-h); }
.upload-btn:active { opacity: 0.85; }

/* Upload Progress Bar */
.progress-wrap { display: none; margin-top: 12px; background: rgba(255,255,255,0.06); border-radius: 8px; overflow: hidden; height: 6px; }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--brand), #60a5fa); border-radius: 8px; transition: width .2s ease; }
.upload-status { margin-top: 8px; font-size: 12.5px; text-align: center; color: var(--hint-color); display: flex; justify-content: space-between; align-items: center; }

/* Search and Filters */
.search-input { width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 13.5px; margin-bottom: 10px; outline: none; transition: border-color .15s; }
.search-input:focus { border-color: var(--button-color); }
.filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.ftab { padding: 5px 12px; border-radius: 16px; background: rgba(255,255,255,0.06); color: var(--hint-color); font-size: 12px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; transition: .15s; }
.ftab.active { background: var(--brand); color: #fff; font-weight: 600; }

/* File List */
.file-list { margin-top: 8px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border-color); gap: 10px; }
.file-item:last-child { border-bottom: none; }
.file-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.file-icon { width: 22px; height: 22px; flex: none; opacity: .85; }
.file-details { flex: 1; min-width: 0; }
.file-name { font-size: 13px; font-weight: 500; word-break: break-all; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-meta { font-size: 11.5px; color: var(--hint-color); margin-top: 2px; font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }

.btn-act { padding: 7px 11px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.08); color: var(--text-color); text-decoration: none; font-size: 12px; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: background .15s; }
.btn-act:hover { background: rgba(255,255,255,0.15); }
.btn-act svg { width: 15px; height: 15px; }
.stat-pill { display: inline-block; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11px; background: rgba(59,130,246,0.15); color: var(--button-color); font-weight: 700; margin-inline-start: 6px; font-variant-numeric: tabular-nums; }

/* Toast */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid var(--border-color); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 999; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
<div class="header">
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
    <span>انبار · Object Storage</span>
  </h1>
  <p>فضای ذخیره‌سازی ابری مستقیم در تلگرام</p>
</div>

<div class="card">
  <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)">
  <button class="upload-btn" id="uploadTriggerBtn" onclick="document.getElementById('file-input').click()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
    <span>انتخاب و آپلود فایل</span>
  </button>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div id="status" class="upload-status" style="display: none;">
    <span id="statusText">درحال آپلود...</span>
    <span id="statusPercent" style="font-weight: 700; font-variant-numeric: tabular-nums;">0%</span>
  </div>
</div>

<div class="card">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
    <h3 style="font-size: 14.5px; display: flex; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>فایل‌های ذخیره‌شده</span>
    </h3>
    <span id="fileCountBadge" class="stat-pill">0</span>
  </div>
  <input type="text" id="searchInput" class="search-input" placeholder="جستجو در فایل‌ها..." oninput="filterFiles()">
  <div class="filter-tabs">
    <button class="ftab active" data-type="" onclick="setTypeFilter('', this)">همه</button>
    <button class="ftab" data-type="image" onclick="setTypeFilter('image', this)">عکس</button>
    <button class="ftab" data-type="video" onclick="setTypeFilter('video', this)">ویدیو</button>
    <button class="ftab" data-type="audio" onclick="setTypeFilter('audio', this)">صدا</button>
    <button class="ftab" data-type="doc" onclick="setTypeFilter('doc', this)">اسناد</button>
  </div>
  <div id="files" class="file-list">
    <p style="color: var(--hint-color); font-size: 13px; text-align: center; padding: 14px 0;">درحال بارگذاری...</p>
  </div>
</div>

<div id="toast" class="toast">پیام</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('secondary_bg_color');
}

let allFiles = [];
let activeTypeFilter = "";

function showToast(msg) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2500);
}

function humanSize(b) {
  if (!b || b <= 0) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(i ? 1 : 0) + " " + u[i];
}

function getFileTypeIcon(name) {
  const ext = (name || "").split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','webp','gif','svg','bmp'].includes(ext)) {
    return `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
  }
  if (['mp4','mkv','webm','mov','avi'].includes(ext)) {
    return `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
  }
  if (['mp3','wav','ogg','m4a','flac','aac'].includes(ext)) {
    return `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;
  }
  if (['pdf','doc','docx','txt','md'].includes(ext)) {
    return `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
  }
  return `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>`;
}

async function initSession() {
  const initData = tg?.initData || "";
  if (!initData) return;
  try {
    await fetch("/ui/miniapp/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ init_data: initData }),
    });
  } catch (e) {
    console.warn("miniapp session init failed", e);
  }
}

async function loadFiles() {
  try {
    const res = await fetch("/api/v1/files", { credentials: "include" });
    if (res.ok) {
      const data = await res.json();
      allFiles = data.items || [];
      filterFiles();
    } else {
      document.getElementById("files").innerHTML =
        '<p style="color: var(--hint-color); font-size: 13px; text-align: center; padding: 14px 0;">خطا در دریافت لیست فایل‌ها</p>';
    }
  } catch (err) {
    document.getElementById("files").innerHTML =
      '<p style="color: var(--hint-color); font-size: 13px; text-align: center; padding: 14px 0;">خطا در اتصال به سرور</p>';
  }
}

function setTypeFilter(t, btn) {
  activeTypeFilter = t;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  filterFiles();
}

function filterFiles() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let list = allFiles;
  if (activeTypeFilter) {
    list = list.filter(f => {
      const ext = (f.filename || "").split('.').pop().toLowerCase();
      if (activeTypeFilter === 'image') return ['jpg','jpeg','png','webp','gif','svg','bmp'].includes(ext);
      if (activeTypeFilter === 'video') return ['mp4','mkv','webm','mov','avi'].includes(ext);
      if (activeTypeFilter === 'audio') return ['mp3','wav','ogg','m4a','flac','aac'].includes(ext);
      if (activeTypeFilter === 'doc') return ['pdf','doc','docx','txt','md'].includes(ext);
      return true;
    });
  }
  if (q) {
    list = list.filter(f => (f.filename || f.id).toLowerCase().includes(q));
  }
  renderList(list);
}

function renderList(list) {
  const box = document.getElementById("files");
  const badge = document.getElementById("fileCountBadge");
  if (badge) badge.textContent = list.length;
  if (!list.length) {
    box.innerHTML = '<p style="color: var(--hint-color); font-size: 13px; text-align: center; padding: 16px 0;">هیچ فایلی یافت نشد.</p>';
    return;
  }
  const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  box.innerHTML = list.map(f => `
    <div class="file-item">
      <div class="file-info">
        ${getFileTypeIcon(f.filename || f.id)}
        <div class="file-details">
          <div class="file-name" title="${esc(f.filename || f.id)}">${esc(f.filename || f.id)}</div>
          <div class="file-meta">
            <span>${humanSize(f.size)}</span>
            <span>·</span>
            <span>${f.downloaded || 0} دانلود</span>
          </div>
        </div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn-act" onclick="copyLink('${esc(f.id)}')" title="کپی لینک" aria-label="کپی لینک">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </button>
        <a href="/f/${encodeURIComponent(f.id)}" target="_blank" class="btn-act" title="دانلود" aria-label="دانلود">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
      </div>
    </div>
  `).join("");
}

function copyLink(id) {
  const url = location.origin + "/f/" + id;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      showToast("لینک فایل کپی شد");
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    });
  } else {
    showToast(url);
  }
}

async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const btn = document.getElementById("uploadTriggerBtn");
  const pWrap = document.getElementById("progressWrap");
  const pBar = document.getElementById("progressBar");
  const statBox = document.getElementById("status");
  const statText = document.getElementById("statusText");
  const statPct = document.getElementById("statusPercent");

  btn.style.opacity = ".6";
  btn.disabled = true;
  pWrap.style.display = "block";
  pBar.style.width = "0%";
  statBox.style.display = "flex";
  statText.textContent = "درحال ارسال: " + file.name;
  statPct.textContent = "0%";

  const fd = new FormData();
  fd.append("file", file);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/v1/upload");
  xhr.withCredentials = true;

  xhr.upload.onprogress = ev => {
    if (ev.lengthComputable) {
      const pct = Math.round((ev.loaded / ev.total) * 100);
      pBar.style.width = pct + "%";
      statPct.textContent = pct + "%";
    }
  };

  xhr.onload = () => {
    btn.style.opacity = "1";
    btn.disabled = false;
    if (xhr.status >= 200 && xhr.status < 300) {
      pBar.style.width = "100%";
      statText.textContent = "آپلود انجام شد: " + file.name;
      statPct.textContent = "100%";
      showToast("فایل با موفقیت آپلود شد");
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
      setTimeout(() => {
        pWrap.style.display = "none";
        statBox.style.display = "none";
      }, 3000);
      loadFiles();
    } else {
      statText.textContent = "خطا در آپلود (" + xhr.status + ")";
      showToast("خطا در آپلود");
    }
  };

  xhr.onerror = () => {
    btn.style.opacity = "1";
    btn.disabled = false;
    statText.textContent = "خطا در اتصال به سرور";
    showToast("خطای شبکه");
  };

  xhr.send(fd);
  e.target.value = "";
}

initSession().finally(() => {
  loadFiles();
});
</script>
</body>
</html>
