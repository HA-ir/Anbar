name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install (runtime deps only)
        run: uv sync --no-extra dev

      - name: pip-audit — dependency CVE scan
        run: |
          uvx pip-audit --strict \
            --skip-editable \
            --progress-spinner off
