name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update -qy
          sudo apt-get install -qy ffmpeg

      - uses: astral-sh/setup-uv@v4

      - name: Install
        run: uv sync --extra dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck (mypy)
        run: uv run mypy src

      - name: Test
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t anbar:ci .
      - name: Smoke — healthz
        run: |
          docker run -d --name tglp -e ANBAR_BACKEND=fake -p 127.0.0.1:8567:8567 anbar:ci
          for i in $(seq 1 15); do
            sleep 1
            if curl -fsS http://127.0.0.1:8567/healthz; then exit 0; fi
          done
          echo "healthz never came up"; exit 1
